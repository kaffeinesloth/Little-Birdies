services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "8000:8000"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    env_file:
      - path: ai_service/.env
        required: false
    environment:
      BACKEND_URL: http://backend:8000
      CHROMA_PERSIST_DIR: /data/chroma_db
    ports:
      - "8001:8001"
    volumes:
      - ai_chroma_data:/data/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  store-website:
    build:
      context: .
      dockerfile: store/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:80"

  flutter-web:
    build:
      context: .
      dockerfile: mobile/Dockerfile.web
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ai_chroma_data:
